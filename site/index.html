<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Skills Compatibility Matrix</title>
  <meta name="description" content="Will this AI agent skill work in your coding agent? A verified, machine-checkable matrix of skill × agent compatibility across Claude Code, Cursor, Codex CLI, Gemini CLI, and more." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" @click.prevent="view='matrix'">
        <span class="brand-mark">🧩</span>
        <span class="brand-text" x-text="t('brandText')"></span>
      </a>
      <nav class="nav">
        <a href="#" :class="{active: view==='matrix'}" @click.prevent="view='matrix'" x-text="t('navSkills')"></a>
        <a href="#" :class="{active: view==='agents'}" @click.prevent="view='agents'" x-text="t('navAgents')"></a>
        <button class="lang-toggle" @click="toggleLang()" :title="t('langToggleTitle')">
          <span class="lang-current" x-text="lang==='en' ? 'EN' : '中'"></span>
          <span class="lang-sep">/</span>
          <span class="lang-switch" x-text="lang==='en' ? '中' : 'EN'"></span>
        </button>
        <a href="https://github.com/porex-bot/agent-skills-compat-matrix" class="nav-gh">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="container" x-data="matrixApp()" x-init="init()" x-cloak>

    <!-- HERO -->
    <section class="hero" x-show="view==='matrix' || view==='agents'">
      <p class="kicker" x-text="view==='matrix' ? '§ 01 — Skill × Agent' : '§ 02 — Agent Capabilities'"></p>
      <h1 x-html="t('heroTitle')"></h1>
      <p class="lede" x-html="t('heroLede')"></p>
      <div class="stat-row" x-show="loaded">
        <div class="stat"><span class="stat-num" x-text="skills.length"></span><span class="stat-label" x-text="t('statSkills')"></span></div>
        <div class="stat"><span class="stat-num" x-text="agents.length"></span><span class="stat-label" x-text="t('statAgents')"></span></div>
        <div class="stat"><span class="stat-num" x-text="portableCount"></span><span class="stat-label" x-text="t('statPortable')"></span></div>
        <div class="stat"><span class="stat-num" x-text="riskyCount"></span><span class="stat-label" x-text="t('statRisky')"></span></div>
      </div>
    </section>

    <!-- LOADING -->
    <div class="loading" x-show="!loaded">
      <div class="spinner"></div>
      <p x-text="t('loading')"></p>
    </div>

    <!-- SKILLS VIEW -->
    <section x-show="loaded && view==='matrix'">
      <div class="controls">
        <div class="search-wrap">
          <input type="search" class="search" :placeholder="t('searchPlaceholder')"
                 x-model="query" @input="resetPage()" />
        </div>
        <div class="filter-group">
          <label class="filter-label" x-text="t('filterAgent')"></label>
          <select x-model="agentFilter" @change="resetPage()">
            <option value="" x-text="t('allAgents')"></option>
            <template x-for="a in agents" :key="a.id">
              <option :value="a.id" x-text="a.name"></option>
            </template>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" x-text="t('filterLevel')"></label>
          <select x-model="levelFilter" @change="resetPage()">
            <option value="" x-text="t('anyLevel')"></option>
            <option value="native" x-text="t('level_native')"></option>
            <option value="compatible" x-text="t('level_compatible')"></option>
            <option value="partial" x-text="t('level_partial')"></option>
            <option value="unsupported" x-text="t('level_unsupported')"></option>
            <option value="unknown" x-text="t('level_unknown')"></option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" x-text="t('filterCategory')"></label>
          <select x-model="categoryFilter" @change="resetPage()">
            <option value="" x-text="t('allCategories')"></option>
            <template x-for="c in categories" :key="c">
              <option :value="c" x-text="t('cat_' + c)"></option>
            </template>
          </select>
        </div>
      </div>

      <p class="result-count" x-text="resultCountText"></p>

      <!-- Skills table (desktop) -->
      <div class="table-wrap desktop-only" x-show="filteredSkills.length">
        <table class="matrix-table">
          <thead>
            <tr>
              <th class="sticky-col skill-col" x-text="t('colSkill')"></th>
              <template x-for="a in agents" :key="a.id">
                <th class="agent-col">
                  <span class="agent-name" x-text="a.name"></span>
                  <span class="agent-vendor" x-text="a.vendor"></span>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="s in pagedSkills" :key="s.id">
              <tr class="skill-row" @click="openSkill(s.id)">
                <td class="sticky-col skill-col">
                  <div class="skill-name" x-text="s.name"></div>
                  <div class="skill-desc-row" x-text="skillDesc(s)"></div>
                  <div class="skill-meta">
                    <span class="cat-tag" x-text="t('cat_' + s.category)"></span>
                    <a :href="s.url || `https://github.com/${s.repo}`" @click.stop target="_blank" class="repo-link" x-text="s.repo"></a>
                  </div>
                </td>
                <template x-for="a in agents" :key="a.id">
                  <td class="cell" :class="cellClass(s, a.id)" :title="cellTitle(s, a.id)">
                    <span class="dot"></span>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Skills cards (mobile) -->
      <div class="skill-cards mobile-only" x-show="filteredSkills.length">
        <template x-for="s in pagedSkills" :key="s.id">
          <article class="skill-card" @click="openSkill(s.id)">
            <div class="skill-card-head">
              <h3 x-text="s.name"></h3>
              <span class="cat-tag" x-text="t('cat_' + s.category)"></span>
            </div>
            <p class="skill-card-desc" x-text="skillDesc(s)"></p>
            <div class="skill-card-foot">
              <span class="portability-badge" :class="portabilityClass(s)">
                <span class="dot"></span>
                <span x-text="portabilityText(s)"></span>
              </span>
              <span class="skill-card-hint" x-text="t('tapForDetails')"></span>
            </div>
          </article>
        </template>
      </div>

      <div class="empty" x-show="!filteredSkills.length">
        <p x-text="t('noResults')"></p>
      </div>

      <div class="pagination" x-show="filteredSkills.length > pageSize">
        <button @click="prevPage()" :disabled="page===1" x-text="t('prev')"></button>
        <span x-text="`${page} / ${totalPages}`"></span>
        <button @click="nextPage()" :disabled="page===totalPages" x-text="t('next')"></button>
      </div>

      <div class="legend">
        <span class="lg"><span class="dot dot-native"></span><span x-text="t('level_native') + ' / ' + t('level_compatible')"></span></span>
        <span class="lg"><span class="dot dot-partial"></span><span x-text="t('level_partial')"></span></span>
        <span class="lg"><span class="dot dot-unsupported"></span><span x-text="t('level_unsupported')"></span></span>
        <span class="lg"><span class="dot dot-unknown"></span><span x-text="t('level_unknown')"></span></span>
      </div>
    </section>

    <!-- AGENTS VIEW -->
    <section x-show="loaded && view==='agents'">
      <div class="feature-table-wrap">
        <div class="table-wrap">
          <table class="feature-table">
            <thead>
              <tr>
                <th x-text="t('colFeature')"></th>
                <template x-for="a in agents" :key="a.id">
                  <th x-text="a.name"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in featureRows" :key="row.key">
                <tr>
                  <td class="feature-name" x-text="t('feat_' + row.key)"></td>
                  <template x-for="a in agents" :key="a.id">
                    <td class="cell" :class="featClass(a, row.key)">
                      <span class="dot"></span>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <div class="agent-cards">
        <template x-for="a in agents" :key="a.id">
          <article class="agent-card" @click="openAgent(a.id)">
            <header>
              <h3 x-text="a.name"></h3>
              <span class="agent-vendor" x-text="a.vendor"></span>
            </header>
            <dl class="agent-facts">
              <div><dt x-text="t('rulesFile')"></dt><dd x-text="a.rules_file"></dd></div>
              <div><dt x-text="t('skillFile')"></dt><dd x-text="a.skills_file"></dd></div>
              <div><dt x-text="t('installProject')"></dt><dd x-text="a.install_path.project"></dd></div>
              <div><dt x-text="t('installUser')"></dt><dd x-text="a.install_path.user"></dd></div>
            </dl>
            <p class="agent-notes" x-text="a.notes"></p>
          </article>
        </template>
      </div>
    </section>

    <!-- SKILL DETAIL MODAL -->
    <div class="modal-backdrop" x-show="selectedSkill" x-cloak @click.self="selectedSkill=null">
      <div class="modal" x-show="selectedSkill">
        <template x-if="selectedSkill">
          <div>
            <button class="modal-close" @click="selectedSkill=null">✕</button>
            <p class="modal-kicker" x-text="t('cat_' + selectedSkill.category)"></p>
            <h2 x-text="selectedSkill.name"></h2>
            <p class="modal-desc" x-text="skillDesc(selectedSkill)"></p>
            <div class="modal-meta">
              <a :href="selectedSkill.url || `https://github.com/${selectedSkill.repo}`" target="_blank" class="repo-link" x-text="selectedSkill.repo"></a>
              <span class="verified" x-text="t('verified', {date: selectedSkill.verified_at})"></span>
            </div>
            <template x-if="selectedSkill.uses_claude_extensions && selectedSkill.uses_claude_extensions.length">
              <div class="extensions">
                <span class="ext-label" x-text="t('claudeExtUsed')"></span>
                <template x-for="e in selectedSkill.uses_claude_extensions" :key="e">
                  <code class="ext-chip" x-text="e"></code>
                </template>
              </div>
            </template>
            <h3 x-text="t('compatPerAgent')"></h3>
            <table class="detail-table">
              <thead>
                <tr>
                  <th x-text="t('colAgent')"></th>
                  <th x-text="t('colSupport')"></th>
                  <th x-text="t('colCaveat')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="a in agents" :key="a.id">
                  <tr>
                    <td x-text="a.name"></td>
                    <td class="cell" :class="cellClass(selectedSkill, a.id)">
                      <span class="dot"></span>
                      <span class="level-text" x-text="t('level_' + cellLevel(selectedSkill, a.id))"></span>
                    </td>
                    <td class="caveat-cell" x-text="caveatText(selectedSkill, a.id)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </div>

    <!-- AGENT DETAIL MODAL -->
    <div class="modal-backdrop" x-show="selectedAgent" x-cloak @click.self="selectedAgent=null">
      <div class="modal" x-show="selectedAgent">
        <template x-if="selectedAgent">
          <div>
            <button class="modal-close" @click="selectedAgent=null">✕</button>
            <p class="modal-kicker" x-text="selectedAgent.vendor"></p>
            <h2 x-text="selectedAgent.name"></h2>
            <a :href="selectedAgent.homepage" target="_blank" class="repo-link" x-text="selectedAgent.homepage"></a>
            <h3 x-text="t('features')"></h3>
            <div class="feature-grid">
              <template x-for="row in featureRows" :key="row.key">
                <div class="feature-item" :class="featClass(selectedAgent, row.key)">
                  <span class="dot"></span>
                  <span x-text="t('feat_' + row.key)"></span>
                </div>
              </template>
            </div>
            <h3 x-text="t('rulesFile') + ' / ' + t('skillFile')"></h3>
            <dl class="agent-facts">
              <div><dt x-text="t('rulesFile')"></dt><dd x-text="selectedAgent.rules_file"></dd></div>
              <div><dt x-text="t('skillFile')"></dt><dd x-text="selectedAgent.skills_file"></dd></div>
              <div><dt x-text="t('installProject')"></dt><dd x-text="selectedAgent.install_path.project"></dd></div>
              <div><dt x-text="t('installUser')"></dt><dd x-text="selectedAgent.install_path.user"></dd></div>
              <div><dt x-text="t('frontmatterReq')"></dt><dd x-text="(selectedAgent.frontmatter_required||[]).join(', ') || t('none')"></dd></div>
              <div><dt x-text="t('frontmatterOpt')"></dt><dd x-text="(selectedAgent.frontmatter_optional||[]).join(', ') || t('none')"></dd></div>
            </dl>
            <h3 x-text="t('notes')"></h3>
            <p class="agent-notes" x-text="selectedAgent.notes"></p>
          </div>
        </template>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p x-html="t('footerMain')"></p>
      <p class="fineprint" x-html="t('footerFineprint')"></p>
    </div>
  </footer>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="i18n.js"></script>
  <script>
    const DATA_CANDIDATES = ['./data', '../data'];

    function matrixApp() {
      return {
        view: 'matrix',
        loaded: false,
        agents: [],
        skills: [],
        query: '',
        agentFilter: '',
        levelFilter: '',
        categoryFilter: '',
        page: 1,
        pageSize: 25,
        selectedSkill: null,
        selectedAgent: null,
        lang: 'en',
        featureRows: [
          { key: 'hooks' },
          { key: 'subagent' },
          { key: 'context_fork' },
          { key: 'progressive_disclosure' },
          { key: 'pre_approved_tools' },
          { key: 'slash_command' },
          { key: 'glob_scoping' },
          { key: 'model_override' },
        ],

        init() {
          const saved = localStorage.getItem('matrix-lang');
          if (saved === 'en' || saved === 'zh') {
            this.lang = saved;
          } else if (navigator.language && navigator.language.startsWith('zh')) {
            this.lang = 'zh';
          }
          this.syncHtmlLang();
          this.load();
        },

        t(key, params) {
          return I18N.translate(this.lang, key, params);
        },

        skillDesc(s) {
          if (!s) return '';
          return this.lang === 'zh' ? (s.description_zh || s.description || '') : (s.description || '');
        },

        toggleLang() {
          this.lang = this.lang === 'en' ? 'zh' : 'en';
          localStorage.setItem('matrix-lang', this.lang);
          this.syncHtmlLang();
        },

        syncHtmlLang() {
          document.documentElement.lang = this.lang;
        },

        async _fetchData() {
          for (const base of DATA_CANDIDATES) {
            try {
              const [aRes, sRes] = await Promise.all([
                fetch(base + '/agents.json'),
                fetch(base + '/skills.json'),
              ]);
              if (aRes.ok && sRes.ok) {
                return { agents: (await aRes.json()).agents, skills: (await sRes.json()).skills };
              }
            } catch (e) { /* try next candidate */ }
          }
          throw new Error('Could not load data');
        },

        async load() {
          try {
            const data = await this._fetchData();
            this.agents = data.agents;
            this.skills = data.skills;
            this.loaded = true;
          } catch (e) {
            console.error('Failed to load matrix data', e);
          }
        },

        get categories() {
          return [...new Set(this.skills.map(s => s.category))].sort();
        },
        get filteredSkills() {
          const q = this.query.trim().toLowerCase();
          return this.skills.filter(s => {
            if (q) {
              const hay = (s.name + ' ' + s.repo + ' ' + (s.description||'') + ' ' + (s.description_zh||'') + ' ' + s.category + ' ' + this.t('cat_' + s.category)).toLowerCase();
              if (!hay.includes(q)) return false;
            }
            if (this.categoryFilter && s.category !== this.categoryFilter) return false;
            if (this.agentFilter) {
              const level = (s.compatibility || {})[this.agentFilter] || 'unknown';
              if (this.levelFilter && level !== this.levelFilter) return false;
            } else if (this.levelFilter) {
              const vals = Object.values(s.compatibility || {});
              if (!vals.includes(this.levelFilter)) return false;
            }
            return true;
          });
        },
        get totalPages() {
          return Math.max(1, Math.ceil(this.filteredSkills.length / this.pageSize));
        },
        get pagedSkills() {
          const start = (this.page - 1) * this.pageSize;
          return this.filteredSkills.slice(start, start + this.pageSize);
        },
        get portableCount() {
          const primary = ['claude-code','cursor','codex-cli','gemini-cli','open-standard'];
          return this.skills.filter(s => {
            const levels = primary.map(a => (s.compatibility||{})[a] || 'unknown');
            return levels.every(l => l === 'native' || l === 'compatible');
          }).length;
        },
        get riskyCount() {
          return this.skills.filter(s => (s.uses_claude_extensions||[]).length).length;
        },
        get resultCountText() {
          const n = this.filteredSkills.length;
          return this.lang === 'zh'
            ? `${n} 个 skill 匹配`
            : `${n} skill${n===1?'':'s'} match`;
        },

        resetPage() { this.page = 1; },
        prevPage() { if (this.page > 1) this.page--; },
        nextPage() { if (this.page < this.totalPages) this.page++; },

        cellLevel(s, aid) { return (s.compatibility || {})[aid] || 'unknown'; },
        cellClass(s, aid) { return 'lvl-' + this.cellLevel(s, aid); },
        cellTitle(s, aid) {
          const lvlLabel = this.t('level_' + this.cellLevel(s, aid));
          const ct = this.caveatText(s, aid);
          return ct && ct !== '—' ? `${lvlLabel}: ${ct}` : lvlLabel;
        },
        caveatText(s, aid) {
          const en = s.caveats && s.caveats[aid];
          if (!en) return '—';
          const zh = s.caveats_zh && s.caveats_zh[aid];
          return I18N.caveat(this.lang, aid, en, zh);
        },
        supportCount(s) {
          if (!s.compatibility) return 0;
          return Object.values(s.compatibility).filter(l => l === 'native' || l === 'compatible').length;
        },
        portabilityClass(s) {
          const total = this.agents.length || 1;
          const ratio = this.supportCount(s) / total;
          if (ratio >= 0.8) return 'port-good';
          if (ratio >= 0.4) return 'port-mid';
          return 'port-low';
        },
        portabilityText(s) {
          return this.t('portableSummary', { n: this.supportCount(s), total: this.agents.length });
        },
        featLevel(a, key) { return (a.features || {})[key] || 'unknown'; },
        featClass(a, key) { return 'lvl-' + this.featLevel(a, key); },

        openSkill(id) { this.selectedSkill = this.skills.find(s => s.id === id) || null; },
        openAgent(id) { this.selectedAgent = this.agents.find(a => a.id === id) || null; },
      };
    }
  </script>
</body>
</html>
